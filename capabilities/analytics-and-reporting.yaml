naftiko: 1.0.0-alpha2
info:
  label: SAP Business Intelligence Analytics and Reporting
  description: Workflow capability for creating, managing, and distributing analytics content across SAP Analytics Cloud and
    SAP BusinessObjects BI Platform. Supports story authoring, report scheduling, and content governance. Used by BI developers,
    analysts, and report consumers.
  tags:
  - Analytics
  - Business Intelligence
  - Reporting
  - SAP
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SAP_BI_OAUTH_TOKEN: SAP_BI_OAUTH_TOKEN
    SAP_BOBJ_LOGON_TOKEN: SAP_BOBJ_LOGON_TOKEN
capability:
  consumes:
  - type: http
    namespace: sap-bi-analytics-cloud
    baseUri: https://{tenant}.sapanalytics.cloud/api/v1
    description: SAP Analytics Cloud REST API for managing stories, models, users, and folders.
    authentication:
      type: bearer
      token: '{{SAP_BI_OAUTH_TOKEN}}'
    resources:
    - name: stories
      path: /stories
      description: Manage analytics stories and dashboards.
      operations:
      - name: list-stories
        method: GET
        description: List all analytics stories accessible to the user.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset
        - name: search
          in: query
          type: string
          required: false
          description: Search stories by name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-story
        method: POST
        description: Create a new analytics story.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            description: '{{tools.description}}'
      - name: get-story
        method: GET
        description: Get details of a specific analytics story.
        inputParameters:
        - name: storyId
          in: path
          type: string
          required: true
          description: The story identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: models
      path: /models
      description: Manage data models and dimensions.
      operations:
      - name: list-models
        method: GET
        description: List all analytics models.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-model
        method: GET
        description: Get details of a specific model.
        inputParameters:
        - name: modelId
          in: path
          type: string
          required: true
          description: The model identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users
      path: /users
      description: Manage users and teams.
      operations:
      - name: list-users
        method: GET
        description: List all users in the Analytics Cloud tenant.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: sap-bi-businessobjects
    baseUri: https://{server}:{port}/biprws
    description: SAP BusinessObjects BI Platform RESTful Web Services.
    authentication:
      type: apikey
      key: X-SAP-LogonToken
      value: '{{SAP_BOBJ_LOGON_TOKEN}}'
      placement: header
    resources:
    - name: authentication
      path: /logon/long
      description: Authentication for session management.
      operations:
      - name: logon
        method: POST
        description: Authenticate and obtain a logon token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            userName: '{{tools.userName}}'
            password: '{{tools.password}}'
    - name: info-objects
      path: /v1/infostore
      description: Manage BI platform content objects.
      operations:
      - name: list-info-objects
        method: GET
        description: List content objects from the InfoStore.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-info-object
        method: GET
        description: Get a specific InfoStore object by ID.
        inputParameters:
        - name: objectId
          in: path
          type: string
          required: true
          description: The CMS object identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reports
      path: /v1/reports
      description: Manage and schedule reports.
      operations:
      - name: list-reports
        method: GET
        description: List available reports in the BI Platform.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: sap-bi-analytics-reporting-api
    description: Unified REST API for SAP Business Intelligence analytics and reporting workflows.
    resources:
    - path: /v1/stories
      name: stories
      description: Analytics stories and dashboards.
      operations:
      - method: GET
        name: list-stories
        description: List analytics stories.
        call: sap-bi-analytics-cloud.list-stories
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stories/{storyId}
      name: story
      description: Single analytics story.
      operations:
      - method: GET
        name: get-story
        description: Get a story by ID.
        call: sap-bi-analytics-cloud.get-story
        with:
          storyId: rest.storyId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/models
      name: models
      description: Analytics data models.
      operations:
      - method: GET
        name: list-models
        description: List analytics models.
        call: sap-bi-analytics-cloud.list-models
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports
      name: reports
      description: BusinessObjects reports.
      operations:
      - method: GET
        name: list-reports
        description: List BusinessObjects reports.
        call: sap-bi-businessobjects.list-reports
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/content-objects
      name: content-objects
      description: BI Platform InfoStore objects.
      operations:
      - method: GET
        name: list-content-objects
        description: List InfoStore content objects.
        call: sap-bi-businessobjects.list-info-objects
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: sap-bi-analytics-reporting-mcp
    transport: http
    description: MCP server for AI-assisted SAP BI analytics and reporting.
    tools:
    - name: list-stories
      description: List analytics stories in SAP Analytics Cloud.
      hints:
        readOnly: true
        openWorld: true
      call: sap-bi-analytics-cloud.list-stories
      outputParameters:
      - type: object
        mapping: $.
    - name: get-story
      description: Get details of a specific analytics story.
      hints:
        readOnly: true
        openWorld: false
      call: sap-bi-analytics-cloud.get-story
      with:
        storyId: tools.storyId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-story
      description: Create a new analytics story in SAP Analytics Cloud.
      hints:
        readOnly: false
        openWorld: false
      call: sap-bi-analytics-cloud.create-story
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: list-models
      description: List analytics data models in SAP Analytics Cloud.
      hints:
        readOnly: true
        openWorld: true
      call: sap-bi-analytics-cloud.list-models
      outputParameters:
      - type: object
        mapping: $.
    - name: list-reports
      description: List reports available in the SAP BusinessObjects BI Platform.
      hints:
        readOnly: true
        openWorld: true
      call: sap-bi-businessobjects.list-reports
      outputParameters:
      - type: object
        mapping: $.
    - name: browse-content-library
      description: Browse content objects in the SAP BusinessObjects InfoStore repository.
      hints:
        readOnly: true
        openWorld: true
      call: sap-bi-businessobjects.list-info-objects
      outputParameters:
      - type: object
        mapping: $.
