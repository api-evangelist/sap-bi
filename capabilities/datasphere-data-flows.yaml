naftiko: 1.0.0-alpha2
info:
  label: SAP Business Intelligence SAP Datasphere API — Data Flows
  description: 'SAP Business Intelligence SAP Datasphere API — Data Flows. 3 operations. Lead operation: SAP Business Intelligence
    List data flows. Self-contained Naftiko capability covering one Sap Bi business surface.'
  tags:
  - Sap Bi
  - Data Flows
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_BI_API_KEY: SAP_BI_API_KEY
capability:
  consumes:
  - type: http
    namespace: datasphere-data-flows
    baseUri: https://{tenant}.datasphere.cloud.sap/api/v1
    description: SAP Business Intelligence SAP Datasphere API — Data Flows business capability. Self-contained, no shared
      references.
    resources:
    - name: spaces-spaceId-dataflows
      path: /spaces/{spaceId}/dataflows
      operations:
      - name: listdataflows
        method: GET
        description: SAP Business Intelligence List data flows
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: spaces-spaceId-dataflows-dataFlowId
      path: /spaces/{spaceId}/dataflows/{dataFlowId}
      operations:
      - name: getdataflow
        method: GET
        description: SAP Business Intelligence Get a data flow
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: spaces-spaceId-dataflows-dataFlowId-run
      path: /spaces/{spaceId}/dataflows/{dataFlowId}/run
      operations:
      - name: rundataflow
        method: POST
        description: SAP Business Intelligence Run a data flow
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_BI_API_KEY}}'
  exposes:
  - type: rest
    namespace: datasphere-data-flows-rest
    port: 8080
    description: REST adapter for SAP Business Intelligence SAP Datasphere API — Data Flows. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/spaces/{spaceid}/dataflows
      name: spaces-spaceid-dataflows
      description: REST surface for spaces-spaceId-dataflows.
      operations:
      - method: GET
        name: listdataflows
        description: SAP Business Intelligence List data flows
        call: datasphere-data-flows.listdataflows
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/spaces/{spaceid}/dataflows/{dataflowid}
      name: spaces-spaceid-dataflows-dataflowid
      description: REST surface for spaces-spaceId-dataflows-dataFlowId.
      operations:
      - method: GET
        name: getdataflow
        description: SAP Business Intelligence Get a data flow
        call: datasphere-data-flows.getdataflow
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/spaces/{spaceid}/dataflows/{dataflowid}/run
      name: spaces-spaceid-dataflows-dataflowid-run
      description: REST surface for spaces-spaceId-dataflows-dataFlowId-run.
      operations:
      - method: POST
        name: rundataflow
        description: SAP Business Intelligence Run a data flow
        call: datasphere-data-flows.rundataflow
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: datasphere-data-flows-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Business Intelligence SAP Datasphere API — Data Flows. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: sap-business-intelligence-list-data
      description: SAP Business Intelligence List data flows
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: datasphere-data-flows.listdataflows
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-business-intelligence-get-data
      description: SAP Business Intelligence Get a data flow
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: datasphere-data-flows.getdataflow
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-business-intelligence-run-data
      description: SAP Business Intelligence Run a data flow
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: datasphere-data-flows.rundataflow
      outputParameters:
      - type: object
        mapping: $.
