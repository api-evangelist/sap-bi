naftiko: 1.0.0-alpha2
info:
  label: SAP Business Intelligence SAP BW/4HANA OData API — Queries
  description: 'SAP Business Intelligence SAP BW/4HANA OData API — Queries. 3 operations. Lead operation: SAP Business Intelligence
    List BW queries. Self-contained Naftiko capability covering one Sap Bi business surface.'
  tags:
  - Sap Bi
  - Queries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_BI_API_KEY: SAP_BI_API_KEY
capability:
  consumes:
  - type: http
    namespace: bw4hana-odata-queries
    baseUri: https://{server}:{port}/sap/opu/odata/sap
    description: SAP Business Intelligence SAP BW/4HANA OData API — Queries business capability. Self-contained, no shared
      references.
    resources:
    - name: RSOD_BW_QUERY_SRV-Queries
      path: /RSOD_BW_QUERY_SRV/Queries
      operations:
      - name: listqueries
        method: GET
        description: SAP Business Intelligence List BW queries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: RSOD_BW_QUERY_SRV-Queries('{queryName}')
      path: /RSOD_BW_QUERY_SRV/Queries('{queryName}')
      operations:
      - name: getquery
        method: GET
        description: SAP Business Intelligence Get a BW query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: RSOD_BW_QUERY_SRV-Queries('{queryName}')-Execute
      path: /RSOD_BW_QUERY_SRV/Queries('{queryName}')/Execute
      operations:
      - name: executequery
        method: POST
        description: SAP Business Intelligence Execute a BW query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: basic
      username: '{{env.SAP_BI_USER}}'
      password: '{{env.SAP_BI_PASS}}'
  exposes:
  - type: rest
    namespace: bw4hana-odata-queries-rest
    port: 8080
    description: REST adapter for SAP Business Intelligence SAP BW/4HANA OData API — Queries. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/rsod-bw-query-srv/queries
      name: rsod-bw-query-srv-queries
      description: REST surface for RSOD_BW_QUERY_SRV-Queries.
      operations:
      - method: GET
        name: listqueries
        description: SAP Business Intelligence List BW queries
        call: bw4hana-odata-queries.listqueries
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/rsod-bw-query-srv/queries-queryname
      name: rsod-bw-query-srv-queries-queryname
      description: REST surface for RSOD_BW_QUERY_SRV-Queries('{queryName}').
      operations:
      - method: GET
        name: getquery
        description: SAP Business Intelligence Get a BW query
        call: bw4hana-odata-queries.getquery
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/rsod-bw-query-srv/queries-queryname/execute
      name: rsod-bw-query-srv-queries-queryname-execute
      description: REST surface for RSOD_BW_QUERY_SRV-Queries('{queryName}')-Execute.
      operations:
      - method: POST
        name: executequery
        description: SAP Business Intelligence Execute a BW query
        call: bw4hana-odata-queries.executequery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bw4hana-odata-queries-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Business Intelligence SAP BW/4HANA OData API — Queries. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: sap-business-intelligence-list-bw
      description: SAP Business Intelligence List BW queries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bw4hana-odata-queries.listqueries
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-business-intelligence-get-bw
      description: SAP Business Intelligence Get a BW query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bw4hana-odata-queries.getquery
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-business-intelligence-execute-bw
      description: SAP Business Intelligence Execute a BW query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: bw4hana-odata-queries.executequery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
