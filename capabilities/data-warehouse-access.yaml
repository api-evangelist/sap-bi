naftiko: 1.0.0-alpha2
info:
  label: SAP Business Intelligence Data Warehouse Access
  description: Workflow capability for accessing and querying data from SAP BW/4HANA data warehouse and SAP Datasphere platform.
    Enables data discovery, model browsing, connection management, and analytical data consumption. Used by data engineers,
    BI architects, and analytics platform administrators.
  tags:
  - Business Intelligence
  - Data Warehouse
  - Datasphere
  - SAP
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SAP_BW_USERNAME: SAP_BW_USERNAME
    SAP_BW_PASSWORD: SAP_BW_PASSWORD
    SAP_DATASPHERE_OAUTH_TOKEN: SAP_DATASPHERE_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: sap-bi-bw4hana
    baseUri: https://{server}:{port}/sap/opu/odata/sap
    description: SAP BW/4HANA OData API for data warehouse access.
    authentication:
      type: basic
      username: '{{SAP_BW_USERNAME}}'
      password: '{{SAP_BW_PASSWORD}}'
    resources:
    - name: info-providers
      path: /RSOD_INFOPROV_SRV/InfoProviders
      description: Access InfoProvider metadata and data.
      operations:
      - name: list-info-providers
        method: GET
        description: List all InfoProviders in the BW/4HANA system.
        inputParameters:
        - name: $top
          in: query
          type: integer
          required: false
          description: Maximum records to return
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter expression
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-info-provider
        method: GET
        description: Get details of a specific InfoProvider.
        inputParameters:
        - name: infoProviderName
          in: path
          type: string
          required: true
          description: The InfoProvider name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: sap-bi-datasphere
    baseUri: https://{tenant}.datasphere.cloud.sap/api/v1
    description: SAP Datasphere REST API for space management, connections, data flows, and catalog.
    authentication:
      type: bearer
      token: '{{SAP_DATASPHERE_OAUTH_TOKEN}}'
    resources:
    - name: spaces
      path: /spaces
      description: Manage Datasphere spaces.
      operations:
      - name: list-spaces
        method: GET
        description: List all Datasphere spaces.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-space
        method: POST
        description: Create a new Datasphere space.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            description: '{{tools.description}}'
      - name: get-space
        method: GET
        description: Get details of a specific space.
        inputParameters:
        - name: spaceId
          in: path
          type: string
          required: true
          description: The space identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: connections
      path: /connections
      description: Manage data source connections.
      operations:
      - name: list-connections
        method: GET
        description: List all data source connections.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: catalog
      path: /catalog
      description: Browse the Datasphere data catalog.
      operations:
      - name: list-catalog-items
        method: GET
        description: Browse the Datasphere data catalog.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8081
    namespace: sap-bi-data-warehouse-api
    description: Unified REST API for SAP data warehouse access and Datasphere platform management.
    resources:
    - path: /v1/info-providers
      name: info-providers
      description: BW/4HANA InfoProviders.
      operations:
      - method: GET
        name: list-info-providers
        description: List InfoProviders in BW/4HANA.
        call: sap-bi-bw4hana.list-info-providers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/info-providers/{infoProviderName}
      name: info-provider
      description: Single InfoProvider.
      operations:
      - method: GET
        name: get-info-provider
        description: Get InfoProvider details.
        call: sap-bi-bw4hana.get-info-provider
        with:
          infoProviderName: rest.infoProviderName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/spaces
      name: spaces
      description: Datasphere spaces.
      operations:
      - method: GET
        name: list-spaces
        description: List Datasphere spaces.
        call: sap-bi-datasphere.list-spaces
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connections
      name: connections
      description: Data source connections.
      operations:
      - method: GET
        name: list-connections
        description: List data source connections.
        call: sap-bi-datasphere.list-connections
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalog
      name: catalog
      description: Data catalog.
      operations:
      - method: GET
        name: browse-catalog
        description: Browse the Datasphere data catalog.
        call: sap-bi-datasphere.list-catalog-items
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9081
    namespace: sap-bi-data-warehouse-mcp
    transport: http
    description: MCP server for AI-assisted SAP data warehouse access and platform management.
    tools:
    - name: bw-list-info-providers
      description: List all InfoProviders (InfoCubes, DSOs, CompositeProviders) in SAP BW/4HANA.
      hints:
        readOnly: true
        openWorld: true
      call: sap-bi-bw4hana.list-info-providers
      outputParameters:
      - type: object
        mapping: $.
    - name: bw-get-info-provider
      description: Get metadata for a specific BW/4HANA InfoProvider.
      hints:
        readOnly: true
        openWorld: false
      call: sap-bi-bw4hana.get-info-provider
      with:
        infoProviderName: tools.infoProviderName
      outputParameters:
      - type: object
        mapping: $.
    - name: datasphere-list-spaces
      description: List SAP Datasphere spaces the user has access to.
      hints:
        readOnly: true
        openWorld: true
      call: sap-bi-datasphere.list-spaces
      outputParameters:
      - type: object
        mapping: $.
    - name: datasphere-get-space
      description: Get configuration of a specific Datasphere space.
      hints:
        readOnly: true
        openWorld: false
      call: sap-bi-datasphere.get-space
      with:
        spaceId: tools.spaceId
      outputParameters:
      - type: object
        mapping: $.
    - name: datasphere-list-connections
      description: List all data source connections configured in Datasphere.
      hints:
        readOnly: true
        openWorld: true
      call: sap-bi-datasphere.list-connections
      outputParameters:
      - type: object
        mapping: $.
    - name: datasphere-browse-catalog
      description: Browse the Datasphere data catalog for available datasets and views.
      hints:
        readOnly: true
        openWorld: true
      call: sap-bi-datasphere.list-catalog-items
      outputParameters:
      - type: object
        mapping: $.
