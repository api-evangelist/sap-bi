naftiko: 1.0.0-alpha2
info:
  label: SAP Business Intelligence SAP Datasphere API — Views
  description: 'SAP Business Intelligence SAP Datasphere API — Views. 3 operations. Lead operation: SAP Business Intelligence
    List views. Self-contained Naftiko capability covering one Sap Bi business surface.'
  tags:
  - Sap Bi
  - Views
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_BI_API_KEY: SAP_BI_API_KEY
capability:
  consumes:
  - type: http
    namespace: datasphere-views
    baseUri: https://{tenant}.datasphere.cloud.sap/api/v1
    description: SAP Business Intelligence SAP Datasphere API — Views business capability. Self-contained, no shared references.
    resources:
    - name: spaces-spaceId-views
      path: /spaces/{spaceId}/views
      operations:
      - name: listviews
        method: GET
        description: SAP Business Intelligence List views
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: spaces-spaceId-views-viewId
      path: /spaces/{spaceId}/views/{viewId}
      operations:
      - name: getview
        method: GET
        description: SAP Business Intelligence Get a view
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: spaces-spaceId-views-viewId-deploy
      path: /spaces/{spaceId}/views/{viewId}/deploy
      operations:
      - name: deployview
        method: POST
        description: SAP Business Intelligence Deploy a view
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_BI_API_KEY}}'
  exposes:
  - type: rest
    namespace: datasphere-views-rest
    port: 8080
    description: REST adapter for SAP Business Intelligence SAP Datasphere API — Views. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/spaces/{spaceid}/views
      name: spaces-spaceid-views
      description: REST surface for spaces-spaceId-views.
      operations:
      - method: GET
        name: listviews
        description: SAP Business Intelligence List views
        call: datasphere-views.listviews
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/spaces/{spaceid}/views/{viewid}
      name: spaces-spaceid-views-viewid
      description: REST surface for spaces-spaceId-views-viewId.
      operations:
      - method: GET
        name: getview
        description: SAP Business Intelligence Get a view
        call: datasphere-views.getview
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/spaces/{spaceid}/views/{viewid}/deploy
      name: spaces-spaceid-views-viewid-deploy
      description: REST surface for spaces-spaceId-views-viewId-deploy.
      operations:
      - method: POST
        name: deployview
        description: SAP Business Intelligence Deploy a view
        call: datasphere-views.deployview
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: datasphere-views-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Business Intelligence SAP Datasphere API — Views. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: sap-business-intelligence-list-views
      description: SAP Business Intelligence List views
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: datasphere-views.listviews
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-business-intelligence-get-view
      description: SAP Business Intelligence Get a view
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: datasphere-views.getview
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-business-intelligence-deploy-view
      description: SAP Business Intelligence Deploy a view
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: datasphere-views.deployview
      outputParameters:
      - type: object
        mapping: $.
