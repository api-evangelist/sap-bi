openapi: 3.2.0
info:
  title: SAP Business Intelligence SAP BusinessObjects BI Platform REST Servers API
  description: RESTful web services for SAP BusinessObjects BI Platform administration, content management, scheduling, and reporting. Provides access to manage reports, users, folders, server infrastructure, and content within the BusinessObjects environment via the biprws endpoint.
  version: '1.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/en/index.html
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
servers:
- url: https://{server}:{port}/biprws
  description: SAP BusinessObjects BI Platform Server
  variables:
    server:
      default: localhost
      description: BI Platform server hostname
    port:
      default: '6405'
      description: BI Platform server port
security:
- logonToken: []
tags:
- name: Servers
  description: Monitor and manage BI Platform servers
paths:
  /servers:
    get:
      operationId: listServers
      summary: SAP Business Intelligence List servers
      description: Retrieve a list of all servers in the BI Platform deployment.
      tags:
      - Servers
      responses:
        '200':
          description: List of servers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerCollection'
        '401':
          description: Unauthorized
  /servers/{serverId}:
    get:
      operationId: getServer
      summary: SAP Business Intelligence Get a server
      description: Retrieve details and status of a specific BI Platform server.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/serverId'
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          description: Unauthorized
        '404':
          description: Server not found
components:
  schemas:
    ServerCollection:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/Server'
    Server:
      type: object
      properties:
        id:
          type: integer
          description: Server unique identifier
        name:
          type: string
          description: Server name
        kind:
          type: string
          description: Server type
        status:
          type: string
          enum:
          - Running
          - Stopped
          - Starting
          - Stopping
          description: Current server status
        hostname:
          type: string
          description: Server hostname
        port:
          type: integer
          description: Server port
        pid:
          type: integer
          description: Process ID
  parameters:
    serverId:
      name: serverId
      in: path
      required: true
      description: Server unique identifier
      schema:
        type: string
  securitySchemes:
    logonToken:
      type: apiKey
      in: header
      name: X-SAP-LogonToken
      description: SAP BusinessObjects logon token obtained from the logon endpoint
externalDocs:
  description: SAP BusinessObjects BI Platform REST API Documentation
  url: https://help.sap.com/docs/SAP_BUSINESSOBJECTS_BUSINESS_INTELLIGENCE_PLATFORM
