openapi: 3.2.0
info:
  title: SAP Business Intelligence SAP BW/4HANA OData Metadata API
  description: OData services for accessing SAP BW/4HANA data warehouse content and metadata. Provides programmatic access to query InfoProviders, manage data store objects, browse metadata, and execute analytical queries against the BW/4HANA data warehouse.
  version: '1.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/en/index.html
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
servers:
- url: https://{server}:{port}/sap/opu/odata/sap
  description: SAP BW/4HANA OData Endpoint
  variables:
    server:
      default: localhost
      description: BW/4HANA server hostname
    port:
      default: '443'
      description: BW/4HANA server port
security:
- basicAuth: []
tags:
- name: Metadata
  description: Browse BW/4HANA metadata catalog
paths:
  /RSOD_CATALOG_SRV/CatalogEntries:
    get:
      operationId: listCatalogEntries
      summary: SAP Business Intelligence List metadata catalog entries
      description: Browse the BW/4HANA metadata catalog to discover available objects across the system.
      tags:
      - Metadata
      parameters:
      - $ref: '#/components/parameters/topParam'
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/filterParam'
      - $ref: '#/components/parameters/formatParam'
      responses:
        '200':
          description: List of catalog entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryCollection'
        '401':
          description: Unauthorized
components:
  parameters:
    formatParam:
      name: $format
      in: query
      description: Response format
      schema:
        type: string
        enum:
        - json
        - xml
        default: json
    skipParam:
      name: $skip
      in: query
      description: Number of results to skip for pagination (OData)
      schema:
        type: integer
        default: 0
        minimum: 0
    filterParam:
      name: $filter
      in: query
      description: OData filter expression
      schema:
        type: string
    topParam:
      name: $top
      in: query
      description: Maximum number of results to return (OData)
      schema:
        type: integer
        default: 100
        minimum: 1
  schemas:
    CatalogEntry:
      type: object
      properties:
        ObjectName:
          type: string
          description: Technical name of the object
        ObjectDescription:
          type: string
          description: Object description
        ObjectType:
          type: string
          description: Object type (e.g., ADSO, CPROV, IOBJ)
        InfoArea:
          type: string
          description: InfoArea of the object
        Version:
          type: string
          description: Object version
    CatalogEntryCollection:
      type: object
      properties:
        d:
          type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/CatalogEntry'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: SAP user credentials for BW/4HANA system
externalDocs:
  description: SAP BW/4HANA OData API Documentation
  url: https://help.sap.com/docs/SAP_BW4HANA
