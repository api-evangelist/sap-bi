openapi: 3.2.0
info:
  title: SAP Business Intelligence SAP Datasphere Tasks API
  description: APIs for SAP Datasphere (formerly SAP Data Warehouse Cloud) enabling data integration, space management, model deployment, and analytics. Provides programmatic access to manage spaces, connections, data flows, and consume analytical datasets from the Datasphere platform.
  version: '1.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/en/index.html
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
servers:
- url: https://{tenant}.datasphere.cloud.sap/api/v1
  description: SAP Datasphere Tenant
  variables:
    tenant:
      default: mytenant
      description: SAP Datasphere tenant identifier
security:
- oauth2: []
tags:
- name: Tasks
  description: Manage and monitor task execution
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: SAP Business Intelligence List tasks
      description: Retrieve a list of task executions across the tenant.
      tags:
      - Tasks
      parameters:
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/offsetParam'
      - name: status
        in: query
        description: Filter by task status
        schema:
          type: string
          enum:
          - Running
          - Completed
          - Failed
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunCollection'
        '401':
          description: Unauthorized
  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: SAP Business Intelligence Get a task
      description: Retrieve details and status of a specific task execution.
      tags:
      - Tasks
      parameters:
      - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRun'
        '401':
          description: Unauthorized
        '404':
          description: Task not found
components:
  parameters:
    taskId:
      name: taskId
      in: path
      required: true
      description: Task execution unique identifier
      schema:
        type: string
    offsetParam:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0
    limitParam:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000
  schemas:
    TaskRun:
      type: object
      properties:
        id:
          type: string
          description: Task run unique identifier
        type:
          type: string
          enum:
          - DataFlowExecution
          - ViewDeployment
          - DataReplication
          description: Task type
        status:
          type: string
          enum:
          - Pending
          - Running
          - Completed
          - Failed
          description: Task execution status
        startTime:
          type: string
          format: date-time
          description: When the task started
        endTime:
          type: string
          format: date-time
          description: When the task completed
        rowsProcessed:
          type: integer
          description: Number of rows processed
        errorMessage:
          type: string
          description: Error message if the task failed
    TaskRunCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskRun'
        totalCount:
          type: integer
          description: Total number of task runs
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication for SAP Datasphere
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.datasphere.cloud.sap/oauth/token
          scopes: {}
externalDocs:
  description: SAP Datasphere API Documentation
  url: https://help.sap.com/docs/SAP_DATASPHERE
